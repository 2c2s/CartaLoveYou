<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AERLEN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@200;300;400;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #e5c158;
      --gold-glow: rgba(229, 193, 88, 0.2);
      --deep-pink: #ff1461;
      --pink-glow: rgba(255, 20, 97, 0.25);
      --bg: #050409;
      --panel: rgba(11, 9, 19, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: auto;
    }

    .matrix-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .luxury-card {
      background: var(--panel);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      border: 1px solid rgba(229, 193, 88, 0.12);
      border-radius: 32px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.8),
        0 0 80px rgba(255, 14, 97, 0.03);
      position: relative;
      overflow: hidden;
    }

    .luxury-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.03), transparent);
      transform: skewX(-25deg);
      transition: 0.75s;
    }

    .luxury-card:hover::before { left: 150%; }

    .brand-mark {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 7px;
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold-glow);
      margin-bottom: 35px;
      opacity: 0.8;
    }

    .core-heart {
      width: 55px;
      height: 55px;
      fill: none;
      stroke: var(--deep-pink);
      stroke-width: 1.5;
      cursor: pointer;
      filter: drop-shadow(0 0 8px var(--deep-pink));
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .core-heart.active {
      fill: var(--deep-pink);
      transform: scale(1.15);
      filter: drop-shadow(0 0 25px var(--deep-pink));
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: 2.6rem;
      letter-spacing: 2px;
      margin: 25px 0;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .narrative-stream {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.75);
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 35px;
    }

    .narrative-stream em {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-style: italic;
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .narrative-stream .highlight {
      color: var(--deep-pink);
      font-weight: 400;
      text-shadow: 0 0 15px var(--pink-glow);
    }

    .control-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .lux-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      color: rgba(255,255,255,0.8);
      padding: 16px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lux-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent, rgba(255, 14, 97, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .lux-btn:hover {
      color: #fff;
      background: rgba(255, 14, 97, 0.05);
      border-color: rgba(255, 14, 97, 0.3);
      box-shadow: 0 0 25px rgba(255, 14, 97, 0.15);
      transform: translateY(-3px);
    }

    .lux-btn:active { transform: translateY(-1px); }

    @media (max-width: 480px) {
      .luxury-card { padding: 40px 24px; }
      h1 { font-size: 2.1rem; }
      .narrative-stream { font-size: 0.98rem; }
      .control-deck { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="matrix-container">
    <div class="luxury-card">
      <div class="brand-mark">PRIVATE ARCHIVE</div>
      
      <svg class="core-heart" viewBox="0 0 32 29.6" onclick="engageHeart(this)">
        <path d="M16,28.1L3.4,15.5C0.3,12.4,0.3,7.3,3.4,4.2c3.1-3.1,8.1-3.1,11.2,0l1.4,1.4l1.4-1.4c3.1-3.1,8.1-3.1,11.2,0c3.1,3.1,3.1,8.1,0,11.2L16,28.1z"/>
      </svg>

      <h1>Aerlen</h1>
      
      <div id="stream-box" class="narrative-stream">
        </div>

      <div class="control-deck">
        <button class="lux-btn" onclick="alterSimulation('pulse')">Pulso Íntimo</button>
        <button class="lux-btn" onclick="alterSimulation('orbit')">Gravedad Oro</button>
        <button class="lux-btn" onclick="advanceTimeline()">Avanzar Datos</button>
        <button class="lux-btn" onclick="alterSimulation('shatter')">Dispersión</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('webgl-canvas');
    const ctx = canvas.getContext('2d');
    
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    
    let mouse = { x: w/2, y: h/2, targetX: w/2, targetY: h/2 };
    let particles = [];
    let flowMode = 'cosmic';

    const timeline = [
      "Parecía un entorno aleatorio... nos conocimos en <em>Roblox</em> como una casualidad digital entre millones de servidores.",
      "Pero el código cambió de dirección. De avatares pasamos a realidades, rompiendo la pantalla para fusionar nuestros mundos.",
      "Hoy ya no quedan píxeles fríos. Ahora compartimos <span class='highlight'>tiempo real, amor puro, ternura</span> sin filtros...",
      "...y una <span class='highlight'>intimidad</span> tan absoluta que redefine todo nuestro universo. Eres mi presente eterno, Aerlen."
    ];
    let timelineStep = 0;

    class Particle {
      constructor() {
        this.reset();
        this.y = Math.random() * h;
      }
      reset() {
        this.x = Math.random() * w;
        this.y = -20;
        this.size = Math.random() * 2 + 0.8;
        this.vx = Math.random() * 0.8 - 0.4;
        this.vy = Math.random() * 1.2 + 0.5;
        this.alpha = Math.random() * 0.5 + 0.2;
        this.color = Math.random() > 0.4 ? '#ff1461' : '#e5c158';
        this.baseBlur = Math.random() > 0.7 ? 12 : 0;
      }
      update() {
        // Interacción sutil con el puntero/giroscopio basada en física fluida
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < 180 && flowMode !== 'shatter') {
          let force = (180 - dist) / 180;
          this.x -= (dx / dist) * force * 2;
          this.y -= (dy / dist) * force * 2;
        }

        if (flowMode === 'orbit') {
          this.vx += (mouse.x - this.x) * 0.0002;
          this.vy += (mouse.y - this.y) * 0.0002;
          this.color = '#e5c158';
        } else if (flowMode === 'pulse') {
          this.size += Math.sin(Date.now() * 0.01) * 0.1;
          this.color = '#ff1461';
        } else if (flowMode === 'shatter') {
          this.vx *= 1.05;
          this.vy *= 1.05;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.y > h + 10 || this.x < -10 || this.x > w + 10) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        if (this.baseBlur > 0) {
          ctx.shadowBlur = this.baseBlur;
          ctx.shadowColor = this.color;
        }
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initSimulation() {
      particles = Array.from({ length: 140 }, () => new Particle());
      updateTimelineView();
    }

    function engine() {
      // Interpolación lineal matemática (Lerp) para suavizar movimiento del cursor
      mouse.x += (mouse.targetX - mouse.x) * 0.08;
      mouse.y += (mouse.targetY - mouse.y) * 0.08;

      ctx.fillStyle = 'rgba(5, 4, 9, 0.15)'; // Efecto estela de lujo de baja persistencia
      ctx.fillRect(0, 0, w, h);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(engine);
    }

    function updateTimelineView() {
      const box = document.getElementById('stream-box');
      box.style.transition = 'opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s';
      box.style.opacity = '0';
      box.style.transform = 'translateY(10px)';
      
      setTimeout(() => {
        box.innerHTML = `<p>${timeline[timelineStep]}</p>`;
        box.style.opacity = '1';
        box.style.transform = 'translateY(0)';
      }, 500);
    }

    function advanceTimeline() {
      timelineStep = (timelineStep + 1) % timeline.length;
      updateTimelineView();
      alterSimulation('pulse');
    }

    function alterSimulation(mode) {
      flowMode = mode;
      
      if(mode === 'pulse') {
        particles.forEach(p => { p.vx *= 2; p.vy *= 2; });
      }
      
      setTimeout(() => { 
        flowMode = 'cosmic'; 
        particles.forEach(p => { p.vx = Math.random() * 0.8 - 0.4; p.vy = Math.random() * 1.2 + 0.5; });
      }, 4000);
    }

    function engageHeart(element) {
      element.classList.toggle('active');
      alterSimulation('orbit');
      // Efecto sutil de paralaje en la tarjeta al interactuar
      const card = document.querySelector('.matrix-container');
      card.style.transform = 'scale(1.02) rotateX(4deg)';
      setTimeout(() => card.style.transform = 'scale(1) rotateX(0)', 600);
    }

    // Captura de movimientos orgánica
    window.addEventListener('mousemove', (e) => {
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      mouse.targetX = e.touches[0].clientX;
      mouse.targetY = e.touches[0].clientY;
    });

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    initSimulation();
    engine();
  </script>
</body>
</html>
