<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Aerlen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-pink: #ff2a85;
      --neon-blue: #00f0ff;
      --bg-dark: #0a0612;
      --card-blur: rgba(15, 10, 25, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Inter', sans-serif;
      color: #f4f4f9;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .card {
      background: var(--card-blur);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 42, 133, 0.2);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(255, 42, 133, 0.05);
    }

    .heart-container {
      cursor: pointer;
      display: inline-block;
      margin-bottom: 25px;
    }

    .main-heart {
      width: 70px;
      height: 70px;
      fill: var(--neon-pink);
      filter: drop-shadow(0 0 15px var(--neon-pink));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .heart-container:hover .main-heart {
      transform: scale(1.12);
      fill: var(--neon-blue);
      filter: drop-shadow(0 0 20px var(--neon-blue));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 2.2rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 30%, var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .letter {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(244, 244, 249, 0.85);
      margin-bottom: 30px;
    }

    .letter em {
      font-family: 'Playfair Display', serif;
      color: var(--neon-blue);
    }

    .interactive-text {
      min-height: 50px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.25rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      margin-bottom: 30px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .interactive-text.show { opacity: 1; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .custom-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      padding: 12px 15px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .custom-btn:hover {
      background: rgba(255, 42, 133, 0.1);
      border-color: var(--neon-pink);
      box-shadow: 0 0 15px rgba(255, 42, 133, 0.2);
      transform: translateY(-2px);
    }

    .custom-btn:active { transform: translateY(0); }

    @media (max-width: 480px) {
      .card { padding: 30px 20px; }
      h1 { font-size: 1.8rem; }
      .letter { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <div class="wrapper">
    <div class="card">
      <div class="heart-container" onclick="triggerPulse()">
        <svg class="main-heart" viewBox="0 0 32 29.6">
          <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
            c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
        </svg>
      </div>

      <h1>Para Aerlen</h1>
      
      <div class="letter">
        <p>Tu existencia es magia en un mundo frío. Iluminas mi entorno igual que destellos de neón cruzando la noche en una ciudad eterna. <em>Te amo en este presente y en todos los futuros posibles.</em></p>
      </div>

      <div id="text-display" class="interactive-text"></div>

      <div class="btn-grid">
        <button class="custom-btn" onclick="spawnParticles('pink')">Lluvia Neón</button>
        <button class="custom-btn" onclick="spawnParticles('blue')">Niebla Láser</button>
        <button class="custom-btn" onclick="nextPhrase()">Línea de Código</button>
        <button class="custom-btn" onclick="changeAtmosphere()">Atmósfera</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    let stars = Array.from({length: 80}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.2 + 0.4, d: Math.random() * 0.4 + 0.1
    }));

    let particles = [];
    let currentAtmosphere = 0;

    const phrases = [
      "Eres mi neón favorito en la noche más oscura.",
      "Contigo el tiempo se vuelve un bucle eterno.",
      "Aerlen, eres la línea de código perfecta.",
      "Hackearía el tiempo solo para quedarme en tu invierno.",
      "Tus ojos brillan más que los servidores a máxima carga.",
      "En nuestro universo no existen los errores de sistema.",
      "Tu nombre es mi clave de acceso al mundo real."
    ];
    let phraseIndex = 0;

    function draw() {
      ctx.clearRect(0, 0, w, h);
      
      // Estrellas de fondo eficientes
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.d;
        if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
      });

      // Partículas interactivas
      particles.forEach((p, index) => {
        p.y += p.vy;
        p.x += p.vx;
        p.alpha -= 0.008;

        if (p.alpha <= 0) {
          particles.splice(index, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.shadowBlur = p.blur;
          ctx.shadowColor = p.color;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          if(p.type === 'heart') {
            ctx.translate(p.x, p.y);
            ctx.scale(p.size/10, p.size/10);
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(5,-5,10,2,0,10);
            ctx.bezierCurveTo(-10,2,-5,-5,0,0);
          } else {
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.restore();
        }
      });

      requestAnimationFrame(draw);
    }

    function spawnParticles(mode) {
      const color = mode === 'pink' ? '#ff2a85' : '#00f0ff';
      const type = mode === 'pink' ? 'heart' : 'circle';
      for(let i=0; i<20; i++) {
        particles.push({
          x: Math.random() * w,
          y: -20,
          vx: Math.random() * 2 - 1,
          vy: Math.random() * 3 + 2,
          size: Math.random() * 8 + 6,
          alpha: 1,
          color: color,
          blur: 15,
          type: type
        });
      }
    }

    function nextPhrase() {
      const display = document.getElementById('text-display');
      display.classList.remove('show');
      setTimeout(() => {
        display.innerHTML = phrases[phraseIndex];
        display.classList.add('show');
        phraseIndex = (phraseIndex + 1) % phrases.length;
      }, 300);
    }

    function changeAtmosphere() {
      const styles = [
        { bg: '#0a0612', card: 'rgba(15, 10, 25, 0.6)', neon: '#ff2a85' },
        { bg: '#030b14', card: 'rgba(5, 18, 32, 0.6)', neon: '#00f0ff' },
        { bg: '#14050d', card: 'rgba(30, 8, 20, 0.6)', neon: '#ff0055' },
        { bg: '#0f0c1b', card: 'rgba(22, 17, 39, 0.6)', neon: '#9d4edd' }
      ];
      currentAtmosphere = (currentAtmosphere + 1) % styles.length;
      const setup = styles[currentAtmosphere];
      
      document.body.style.backgroundColor = setup.bg;
      document.querySelector('.card').style.background = setup.card;
      document.documentElement.style.setProperty('--neon-pink', setup.neon);
    }

    function triggerPulse() {
      const heart = document.querySelector('.main-heart');
      heart.style.transform = "scale(1.3)";
      setTimeout(() => heart.style.transform = "scale(1)", 200);
      spawnParticles(Math.random() > 0.5 ? 'pink' : 'blue');
    }

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    draw();
  </script>
</body>
</html>
